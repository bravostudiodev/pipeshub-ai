pipeline:
  stages:

    "Slidev image build":
      branch: "!main"
      imageBuild: &slidevImageBuild
        name: platform/pipeshubai-slidev
        securityScan:
          failSeverity: CRITICAL
          issueAllowlist:
            - CVE-2026-31789
            - CVE-2026-59873
        context: deployment/slidev
        push: true # todo set to false
        tags:
          - 1.0.0-1 # todo  finalize
    "Slidev image build and push":
      branch: "main"
      imageBuild:
        <<: *slidevImageBuild
        push: true
