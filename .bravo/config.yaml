pipeline:
  stages:
    "App build":
      appBuild:
        image:
          name: platform/node
          tag: "20"
        exec:
          script: |
            set -e

            echo "App build: installing backend dependencies"
            cd backend/nodejs/apps
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
              npm ci --ignore-scripts || { echo "App build failed: backend install" >&2; exit 1; }
              npm uninstall jpeg-recompress-bin mozjpeg imagemin-mozjpeg 2>/dev/null || true
              npm install sharp --save || true
            else
              npm ci || { echo "App build failed: backend install" >&2; exit 1; }
            fi
            echo "App build: compiling backend"
            npm run build || { echo "App build failed: backend compilation" >&2; exit 1; }
            echo "App build: pruning backend dependencies"
            npm prune --production || { echo "App build failed: backend prune" >&2; exit 1; }

            echo "App build: installing frontend dependencies"
            cd ../../../frontend
            npm_config_legacy_peer_deps=true npm ci || { echo "App build failed: frontend install" >&2; exit 1; }
            echo "App build: compiling frontend"
            ELECTRON_STATIC=1 npm run build || { echo "App build failed: frontend compilation" >&2; exit 1; }
            echo "App build: complete"
        cache:
          - ~/.npm
          - frontend/.next/cache
    "Image build":
      branch: "!main"
      imageBuild:
        <<: &imageBuild
          name: platform/pipeshubai
          securityScan:
            failSeverity: CRITICAL
            issueAllowlist:
              - CVE-2026-49261
              - CVE-2026-44172
              - CVE-2026-6653
              - CVE-2026-85394
              - CVE-2026-8838
              - GHSA-6q48-6c7w-9gw2
              - CVE-2026-112403
              - GHSA-hq85-5cpj-mr62
              - CVE-2026-91403
              - CVE-2026-112393
              - CVE-2026-112398
              - CVE-2026-112900
          context: .
          push: true # TODO
          tags:
            - 0.9.1.oddyssey2-3 # TODO
    "Image build and push":
      branch: "main"
      imageBuild:
        <<: *imageBuild
        push: true

