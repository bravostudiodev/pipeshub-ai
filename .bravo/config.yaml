pipeline:
  stages:
    "App build":
      appBuild:
        image:
          name: platform/node
          tag: "20"
        exec:
          script: |
            set -e

            (
              set -e
              cd backend/nodejs/apps
              ARCH=$(uname -m)
              if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
                npm ci --ignore-scripts
                npm uninstall jpeg-recompress-bin mozjpeg imagemin-mozjpeg 2>/dev/null || true
                npm install sharp --save || true
              else
                npm ci
              fi
              npm run build
              npm prune --production
            ) &
            backend_pid=$!

            (
              set -e
              cd frontend
              npm_config_legacy_peer_deps=true npm ci
              ELECTRON_STATIC=1 npm run build
            ) &
            frontend_pid=$!

            failed=0
            wait "$backend_pid" || failed=1
            wait "$frontend_pid" || failed=1
            if [ "$failed" -ne 0 ]; then
              echo "App build failed: backend or frontend build did not succeed" >&2
              exit 1
            fi
        cache:
          - ~/.npm
#          - frontend/.next/cache
    "Image build":
      branch: "!main"
      imageBuild:
        <<: &imageBuild
          name: platform/pipeshubai
          securityScan:
            failSeverity: CRITICAL
            issueAllowlist:
              - CVE-2026-49261
              - CVE-2026-44172
              - CVE-2026-6653
              - CVE-2026-85394
              - CVE-2026-8838
              - GHSA-6q48-6c7w-9gw2
              - CVE-2026-112403
              - GHSA-hq85-5cpj-mr62
              - CVE-2026-91403
              - CVE-2026-112393
              - CVE-2026-112398
              - CVE-2026-112900
          context: .
          push: true # TODO
          tags:
            - 0.9.1.oddyssey2-3 # TODO
    "Image build and push":
      branch: "main"
      imageBuild:
        <<: *imageBuild
        push: true

